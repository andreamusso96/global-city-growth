models:
  - name: usa_cluster_growth_population_analysis
    description: "For our final analysis, we build different analysis datasets based on the specs in analysis parameters. These datasets are essentially refined version of our based dataset usa_cluster_growth_population under different analysis parameters, like the urban threshold, the city population threshold. This tables joins all these datasets together and indexes them by analysis_id."
    columns:
      - name: cluster_id
        description: "see usa_cluster_growth_geom"
      - name: y1
        description: "see usa_cluster_growth_geom"
      - name: y2
        description: "see usa_cluster_growth_geom"
      - name: urban_threshold
        description: "see usa_cluster_base_geom"
      - name: population_y1
        description: "see usa_cluster_growth_population"
      - name: population_y2
        description: "see usa_cluster_growth_population"
      - name: analysis_id
        description: "The ID of the analysis"

  - name: usa_dataset_summary_table
    description: "A summary table of the USA dataset used for the analysis."
    columns:
      - name: analysis_id
        description: "see usa_cluster_growth_population_analysis"
      - name: num_cities
        description: "The number of cities in the dataset"
      - name: num_years
        description: "The number of years in the dataset"
      - name: min_year
        description: "The earliest year in the dataset"
      - name: max_year
        description: "The latest year in the dataset"
  
  - name: usa_average_growth
    description: "The average growth of the population of the cities over one decade. This average growth is weighted by the population of the cities."
    columns:
      - name: year
        description: "The start of the decade"
      - name: log_average_growth
        description: "The log10 average growth of the population of the cities over one decade. This average growth is weighted by the population of the cities."
      - name: analysis_id
        description: "see usa_cluster_growth_population_analysis"

  - name: usa_size_vs_growth
    description: "The log population of cities at the start of a decade and the log growth of the city over the decade"
    columns:
      - name: cluster_id
        description: "see usa_cluster_growth_geom"
      - name: year
        description: "The start of the decade"
      - name: log_population
        description: "The log10 population of the city at the start of the decade"
      - name: log_growth
        description: "The log10 growth of the city over the decade"
      - name: analysis_id
        description: "see usa_cluster_growth_population_analysis"

  - name: usa_size_vs_growth_normalized
    description: "The normalized log growth of the city over the decade. The normalized log growth is the log growth minus the average growth of the population nationwide."
    columns:
      - name: cluster_id
        description: "see usa_cluster_growth_geom"
      - name: year
        description: "The start of the decade"
      - name: normalized_log_growth
        description: "The normalized log growth of the city over the decade computed as the log growth minus the average growth of the population nationwide"
      - name: analysis_id
        description: "see usa_cluster_growth_population_analysis"

  - name: usa_rank_vs_size
    description: "The log-rank of the cities  (1 = largest city), vs their log-population in a given decade."
    columns:
      - name: cluster_id
        description: "see usa_cluster_growth_geom"
      - name: year
      - name: log_population
        description: "The log10 of the population of the city"
      - name: log_rank
        description: "The log10 of the rank of the city"
      - name: analysis_id
        description: "see usa_cluster_growth_population_analysis"

  - name: usa_rank_size_slopes_change
    description: "The change in the rank-size slope from some base year to a given year."
    columns:
      - name: year
      - name: year_base
        description: "The base year from which the change is computed"
      - name: analysis_id
        description: "see usa_cluster_growth_population_analysis"
      - name: rank_size_slope_change
        description: "The change in the rank-size slope from the base year to the given year."
      - name: analysis_id
        description: "see usa_cluster_growth_population_analysis"

  - name: usa_suburbanization_size_vs_growth
    description: "The size-growth input table used for the suburbanization comparison in the USA."
    columns:
      - name: definition
        description: "The city definition used in the comparison: base, density, or cbsa."
      - name: cluster_id
        description: "The city identifier under the given definition."
      - name: year
        description: "The start year of the decade."
      - name: log_population
        description: "The log10 population of the city at the start of the decade."
      - name: log_growth
        description: "The log10 growth of the city over the decade."

  - name: usa_suburbanization_average_growth
    description: "Average growth by city definition for the suburbanization comparison."
    columns:
      - name: definition
        description: "The city definition used in the comparison."
      - name: year
        description: "The start year of the decade."
      - name: log_average_growth
        description: "The log10 average growth over the decade."

  - name: usa_suburbanization_size_vs_growth_normalized
    description: "The normalized size-growth input table used for panel B of the suburbanization comparison."
    columns:
      - name: definition
        description: "The city definition used in the comparison."
      - name: cluster_id
        description: "see usa_suburbanization_size_vs_growth"
      - name: year
        description: "The start year of the decade."
      - name: log_population
        description: "see usa_suburbanization_size_vs_growth"
      - name: log_growth
        description: "see usa_suburbanization_size_vs_growth"
      - name: normalized_log_population
        description: "The log population translated by the minimum observed log population within the definition-year sample."
      - name: normalized_log_growth
        description: "The log growth translated by the average growth of the definition-year sample."

  - name: usa_suburbanization_base_centroids
    description: "Centroids for USA base clusters in 2010-2020, materialized separately so neighbor search can use a spatial index on the centroid point geometry."
    columns:
      - name: cluster_id
        description: "The base cluster identifier."
      - name: y1
        description: "The start year of the decade."
      - name: y2
        description: "The end year of the decade."
      - name: population_y1
        description: "The population of the cluster at the start of the decade."
      - name: centroid
        description: "The centroid of the base cluster geometry in EPSG:54009."

  - name: usa_suburbanization_base_neighbor_flags
    description: "Neighbor classification for the suburbanization comparison among USA base clusters below one million inhabitants in 2010."
    columns:
      - name: cluster_id
        description: "The base cluster identifier."
      - name: year
        description: "The start year of the decade."
      - name: population_y1
        description: "The population of the cluster at the start of the decade."
      - name: has_large_nbr
        description: "True if the largest non-self neighbor within 100 km has population above one million."
      - name: neighbor_cluster_id
        description: "The identifier of the largest non-self neighbor within 100 km."
      - name: neighbor_population_y1
        description: "The start-year population of the largest non-self neighbor within 100 km."
      - name: distance
        description: "The centroid-to-centroid distance to the largest non-self neighbor within 100 km."

  - name: usa_suburbanization_cbsa_induced_labels
    description: "Best-match stable CBSA growth-cluster label induced onto each USA 2010-2020 base cluster by maximum overlap area."
    columns:
      - name: cluster_id
        description: "The USA base-cluster identifier used as the common unit for panel C."
      - name: cbsa_cluster_id
        description: "The stable CBSA growth-cluster identifier assigned to the base cluster."
      - name: y1
        description: "The start year of the decade."
      - name: y2
        description: "The end year of the decade."
      - name: population_y1
        description: "The base-cluster population at the start of the decade."
      - name: intersection_area
        description: "The overlap area between the transformed base-cluster geometry and the matched stable CBSA growth geometry in EPSG:5070."
