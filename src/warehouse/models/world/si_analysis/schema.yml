models:
  - name: world_suburbanization_augmented_cluster_metrics
    description: "Restricted base-cluster sample for the gravity-based suburbanization analysis, limited to analysis_id 1 and countries in the 60-100 urbanization group."
    columns:
      - name: cluster_id
        description: "The base morphological cluster identifier."
      - name: country
        description: "The World Bank country code."
      - name: y1
        description: "The start year of the decade."
      - name: y2
        description: "The end year of the decade."
      - name: population_y1
        description: "The cluster population at the start of the decade."
      - name: population_y2
        description: "The cluster population at the end of the decade."
      - name: geom
        description: "The base-cluster growth geometry in the pipeline projection."
      - name: centroid
        description: "The centroid of the base-cluster geometry."
      - name: area
        description: "The area of the base-cluster geometry."

  - name: world_suburbanization_augmented_neighbors
    description: "Candidate neighbor graph for the gravity-based suburbanization analysis, using a 100 km centroid search radius within each decade."
    columns:
      - name: cluster_id
        description: "The source base cluster identifier."
      - name: neighbor_id
        description: "The candidate neighbor cluster identifier, including self-neighbors."
      - name: country
        description: "The country code of the source cluster."
      - name: y1
        description: "The start year of the decade."
      - name: y2
        description: "The end year of the decade."
      - name: distance
        description: "The edge-to-edge distance between source and neighbor geometries."
      - name: area
        description: "The area of the source cluster geometry."
      - name: population_y1
        description: "The start-year population of the source cluster."
      - name: population_y2
        description: "The end-year population of the source cluster."
      - name: neighbor_population_y1
        description: "The start-year population of the neighbor cluster."
      - name: neighbor_population_y2
        description: "The end-year population of the neighbor cluster."

  - name: world_suburbanization_augmented_pull
    description: "Gravity-style pull calculations for each source-neighbor pair in the augmented suburbanization analysis."
    columns:
      - name: cluster_id
        description: "The source base cluster identifier."
      - name: neighbor_id
        description: "The candidate neighbor cluster identifier."
      - name: country
        description: "The country code of the source cluster."
      - name: y1
        description: "The start year of the decade."
      - name: y2
        description: "The end year of the decade."
      - name: distance
        description: "The edge-to-edge distance between source and neighbor geometries."
      - name: area
        description: "The area of the source cluster geometry."
      - name: population_y1
        description: "The start-year population of the source cluster."
      - name: population_y2
        description: "The end-year population of the source cluster."
      - name: neighbor_population_y1
        description: "The start-year population of the neighbor cluster."
      - name: neighbor_population_y2
        description: "The end-year population of the neighbor cluster."
      - name: pull
        description: "The gravity-style pull exerted by the neighbor on the source cluster."
      - name: self_pull
        description: "The internal pull of the source cluster."
      - name: should_merge
        description: "Whether the neighbor pull exceeds the source self-pull."

  - name: world_suburbanization_augmented_mapping
    description: "One-step mapping from base clusters to augmented clusters using the top-ranked gravity pull."
    columns:
      - name: cluster_id
        description: "The source base cluster identifier."
      - name: country
        description: "The country code of the source cluster."
      - name: y1
        description: "The start year of the decade."
      - name: y2
        description: "The end year of the decade."
      - name: neighbor_id
        description: "The highest-pull neighbor for the source cluster."
      - name: distance
        description: "The edge-to-edge distance between source and selected neighbor geometries."
      - name: area
        description: "The area of the source cluster geometry."
      - name: population_y1
        description: "The start-year population of the source cluster."
      - name: population_y2
        description: "The end-year population of the source cluster."
      - name: neighbor_population_y1
        description: "The start-year population of the selected neighbor cluster."
      - name: neighbor_population_y2
        description: "The end-year population of the selected neighbor cluster."
      - name: pull
        description: "The gravity-style pull of the selected neighbor."
      - name: self_pull
        description: "The internal pull of the source cluster."
      - name: should_merge
        description: "Whether the source cluster is assigned to the selected neighbor."
      - name: augmented_cluster_id
        description: "The resulting augmented-cluster identifier."

  - name: world_suburbanization_augmented_population
    description: "Population and size-growth inputs aggregated under the augmented-cluster mapping for countries in the 60-100 urbanization group."
    columns:
      - name: cluster_id
        description: "The augmented-cluster identifier."
      - name: country
        description: "The country code carried from the source base clusters."
      - name: year
        description: "The start year of the decade."
      - name: population_y1
        description: "The aggregated population at the start of the decade."
      - name: population_y2
        description: "The aggregated population at the end of the decade."
      - name: log_population
        description: "The log10 start-year population of the augmented cluster."
      - name: log_growth
        description: "The log10 decade growth of the augmented cluster."

  - name: world_m49_urbanization
    description: "Population-weighted urban population share aggregated to UN M49 sub-regions for the main analysis."
    columns:
      - name: analysis_id
        description: "The analysis id, fixed to the main analysis."
      - name: micro_region
        description: "The UN M49 sub-region name."
      - name: year
      - name: urban_population_share
        description: "The population-weighted urban population share of the sub-region."
      - name: population
        description: "The total population of the sub-region in the given year."

  - name: world_m49_size_growth_slopes_urbanization
    description: "UN M49 sub-region-year size-growth slopes joined to weighted urbanization, restricted to valid sub-regions."
    columns:
      - name: analysis_id
        description: "The analysis id, fixed to the main analysis."
      - name: micro_region
        description: "The UN M49 sub-region name."
      - name: year
      - name: size_growth_slope
        description: "The pooled size-growth slope of the sub-region-year."
      - name: n_cities
        description: "The number of cities pooled in the sub-region-year curve."
      - name: min_n_cities
        description: "The minimum city count of the sub-region across years."
      - name: urban_population_share
        description: "The population-weighted urban population share of the sub-region."

  - name: world_avg_size_growth_slope_m49_borders
    description: "Average UN M49 sub-region size-growth slope across the period of observation, with dissolved borders."
    columns:
      - name: analysis_id
        description: "The analysis id, fixed to the main analysis."
      - name: micro_region
        description: "The UN M49 sub-region name."
      - name: size_growth_slope
        description: "The average size-growth slope across available years for the sub-region."
      - name: min_n_cities
        description: "The minimum city count of the sub-region across years."
      - name: has_data
        description: "Whether the sub-region has valid slope data after exclusions."
      - name: geom
        description: "The dissolved sub-region borders in Mollweide projection (EPSG:54009)."

  - name: world_rank_size_slopes_ols_decade_change
    description: "The change in the rank-size slope (estimated with OLS) over one decade. This table is to compare spline based esitimates of the rank-size slope to OLS estimate in the Supplementary Information."
    columns:
      - name: country
        description: "see world_cluster_growth_geocoding"
      - name: year
        description: "The start of the decade"
      - name: analysis_id
        description: "see world_cluster_growth_population_country_analysis"
      - name: rank_size_slope_decade_change
        description: "The change in the rank-size slope (estimated with OLS) from the start of the decade to the end of the decade"

  - name: world_urb_pop_share_cities_above_1m_projections_ols
    description: "The population share of cities with a population above 1 million calculated using our projection method. This is estimated in the same way as world_population_share_cities_above_1m_projections (i.e., with the equation s = (x_max^{1-alpha} - z^{1-alpha}) / (x_max^{1-alpha} - x_min^{1-alpha})). However, this table uses OLS estimates of the rank-size slope rather than spline based ones. We do not calculate future values of the rank size slope because the main focus here is to compare whether spline based or OLS based estimates are better at reproducing historical data."
    columns:
      - name: country
        description: "see world_cluster_growth_geocoding"
      - name: year
      - name: analysis_id
        description: "see world_cluster_growth_population_analysis"
      - name: urban_population_share_cities_above_one_million
        description: "The population share of cities with a population above 1 million projected using the method described in world_urb_pop_share_cities_above_1m_projections, but using OLS estimates of the rank-size slope rather than spline based ones."
